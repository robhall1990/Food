<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mealio — Family Dinner Planner</title>
<meta name="description" content="Plan family dinners, swap meals in and out of your weekly box, and get an auto-scaled shopping list.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3d7a4e">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mealio">
<style>
  :root {
    --bg: #f6f4ee;
    --card: #ffffff;
    --ink: #29352b;
    --ink-soft: #5c6b5e;
    --green: #3d7a4e;
    --green-deep: #2c5e3a;
    --green-soft: #e3efe6;
    --amber: #e8a13c;
    --amber-soft: #fbf0dc;
    --coral: #e06b52;
    --coral-soft: #fae5e0;
    --line: #e4e0d5;
    --shadow: 0 2px 10px rgba(41, 53, 43, .08);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c211d;
      --card: #262d28;
      --ink: #e8ede8;
      --ink-soft: #a7b3a9;
      --green: #6fb883;
      --green-deep: #8fcda0;
      --green-soft: #2e3d32;
      --amber: #e8b364;
      --amber-soft: #3d3524;
      --coral: #e88a75;
      --coral-soft: #40302b;
      --line: #384038;
      --shadow: 0 2px 10px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5;
    padding-bottom: 20px;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 18px 20px 0; position: sticky; top: 0; z-index: 20;
  }
  .header-row { display: flex; align-items: center; gap: 12px; max-width: 980px; margin: 0 auto; flex-wrap: wrap; }
  .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }
  .logo span { color: var(--green); }
  .tagline { color: var(--ink-soft); font-size: .85rem; flex: 1; min-width: 180px; }
  .family { display: flex; gap: 6px; align-items: center; }
  .member {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--green-soft); color: var(--green-deep);
    border-radius: 99px; padding: 4px 11px; font-size: .8rem; font-weight: 600;
    border: 1px solid transparent; cursor: pointer;
  }
  .member.off { opacity: .35; text-decoration: line-through; }
  .tabs { display: flex; gap: 4px; max-width: 980px; margin: 14px auto 0; }
  .tab {
    border: none; background: none; font: inherit; font-weight: 600; color: var(--ink-soft);
    padding: 10px 16px; cursor: pointer; border-bottom: 3px solid transparent; font-size: .95rem;
  }
  .tab.active { color: var(--green); border-bottom-color: var(--green); }
  main { max-width: 980px; margin: 22px auto; padding: 0 20px; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ---- Weekly box ---- */
  .week-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .week-head h2 { font-size: 1.2rem; }
  .week-head .spacer { flex: 1; }
  .btn {
    border: none; font: inherit; font-weight: 700; cursor: pointer;
    border-radius: 10px; padding: 10px 16px; font-size: .9rem;
    background: var(--green); color: #fff; box-shadow: var(--shadow);
    transition: transform .08s;
  }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: var(--coral); }
  .btn.small { padding: 6px 10px; font-size: .8rem; border-radius: 8px; box-shadow: none; }
  .box-size-ctrl {
    display: flex; align-items: center; gap: 8px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px;
    font-size: .85rem; font-weight: 700; color: var(--ink-soft);
  }
  .box-size-ctrl span { min-width: 64px; text-align: center; }
  .stats { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 16px; font-size: .82rem; color: var(--ink-soft);
  }
  .stat b { display: block; font-size: 1.15rem; color: var(--ink); }
  .box-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .box-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .box-card.locked { outline: 2px solid var(--amber); }
  .box-card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .box-card-actions { display: flex; gap: 4px; }
  .box-card .emoji { font-size: 2.1rem; margin-top: 2px; }
  .meal-name { font-weight: 700; font-size: 1.02rem; cursor: pointer; }
  .meal-name:hover { color: var(--green); }
  .meal-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; align-items: center; }
  .chip {
    font-size: .72rem; font-weight: 600; border-radius: 99px; padding: 2px 9px;
    background: var(--green-soft); color: var(--green-deep);
  }
  .chip.time { background: var(--amber-soft); color: #9a6a1d; }
  @media (prefers-color-scheme: dark) { .chip.time { color: var(--amber); } }
  .chip.kids { background: var(--coral-soft); color: var(--coral); }
  .chip.mine { background: var(--amber-soft); color: #9a6a1d; }
  @media (prefers-color-scheme: dark) { .chip.mine { color: var(--amber); } }
  .chip.day-chip { background: var(--amber-soft); color: #9a6a1d; }
  @media (prefers-color-scheme: dark) { .chip.day-chip { color: var(--amber); } }
  .icon-btn {
    border: 1px solid var(--line); background: var(--card); border-radius: 9px;
    width: 36px; height: 36px; cursor: pointer; font-size: 1rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--green-soft); }
  .box-card.empty-slot {
    border: 2px dashed var(--green); background: transparent; box-shadow: none;
    align-items: center; justify-content: center; text-align: center;
    color: var(--green); font-weight: 700; cursor: pointer; min-height: 170px;
  }
  .empty-week {
    text-align: center; padding: 60px 20px; background: var(--card);
    border: 2px dashed var(--line); border-radius: var(--radius);
  }
  .empty-week p { color: var(--ink-soft); margin: 8px 0 20px; }
  .empty-week .big-emoji { font-size: 3rem; }

  /* ---- Recipes ---- */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .search {
    flex: 1; min-width: 180px; font: inherit; padding: 10px 14px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  .filter-chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    border-radius: 99px; padding: 7px 14px; font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer;
  }
  .filter-chip.active { background: var(--green); border-color: var(--green); color: #fff; }
  .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .recipe-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; cursor: pointer; position: relative;
    transition: transform .1s;
  }
  .recipe-card:hover { transform: translateY(-2px); }
  .recipe-card .emoji { font-size: 1.9rem; }
  .recipe-card h3 { font-size: .95rem; margin: 6px 0 6px; line-height: 1.3; }
  .recipe-card.add-card {
    border: 2px dashed var(--green); background: transparent; box-shadow: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 130px; color: var(--green); font-weight: 700; gap: 6px; text-align: center;
  }
  .fav-mark { position: absolute; top: 12px; right: 12px; font-size: 1rem; }

  /* ---- Shopping ---- */
  .shop-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .shop-head .spacer { flex: 1; }
  .shop-note { color: var(--ink-soft); font-size: .85rem; margin-bottom: 16px; }
  .shop-group { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .shop-group h3 {
    font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
    padding: 10px 16px; background: var(--green-soft); color: var(--green-deep);
  }
  .shop-item { display: flex; align-items: center; gap: 12px; padding: 9px 16px; border-top: 1px solid var(--line); cursor: pointer; }
  .shop-item:first-of-type { border-top: none; }
  .shop-item input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
  .shop-item.done .item-name { text-decoration: line-through; opacity: .45; }
  .item-qty { margin-left: auto; color: var(--ink-soft); font-size: .85rem; white-space: nowrap; }
  .item-del { border: none; background: none; cursor: pointer; color: var(--coral); font-size: 1rem; padding: 0 2px; }
  .extra-row { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
  .extra-row input {
    font: inherit; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); flex: 1; min-width: 0;
  }
  .extra-row input.qty { flex: 0 0 90px; }

  /* ---- Modal ---- */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(20,25,20,.5);
    z-index: 50; padding: 20px; overflow-y: auto;
  }
  .overlay.open { display: flex; align-items: flex-start; justify-content: center; }
  .modal {
    background: var(--card); border-radius: 18px; max-width: 580px; width: 100%;
    padding: 26px; margin: 30px 0; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  .modal .close { position: absolute; top: 14px; right: 14px; }
  .modal h2 { font-size: 1.3rem; margin-bottom: 4px; padding-right: 40px; }
  .modal .meal-meta { margin-bottom: 14px; }
  .section-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); margin: 18px 0 8px; font-weight: 700; }
  .little-ones {
    background: var(--amber-soft); border-radius: 12px; padding: 12px 14px; font-size: .88rem;
  }
  .ing-list { list-style: none; }
  .ing-list li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: .9rem; }
  .ing-list li span:last-child { color: var(--ink-soft); white-space: nowrap; }
  .steps-list { padding-left: 22px; display: grid; gap: 8px; font-size: .9rem; }
  .steps-list li::marker { color: var(--green); font-weight: 700; }
  .nutrition-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .nutrition-grid .stat { background: var(--bg); }
  .nutrition-note { color: var(--ink-soft); font-size: .78rem; margin-top: 2px; }
  .approval-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .approve-btn {
    border: 1px solid var(--line); background: var(--bg); border-radius: 99px;
    padding: 7px 14px; font: inherit; font-size: .85rem; cursor: pointer; font-weight: 600; color: var(--ink);
  }
  .approve-btn.yes { background: var(--green-soft); border-color: var(--green); color: var(--green-deep); }
  .modal-actions { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; align-items: center; }
  .modal-actions select, .form-grid select, .form-grid input, .form-grid textarea, .ing-editor input, .ing-editor select {
    font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink);
  }
  .menu-list { display: grid; gap: 8px; margin-top: 16px; }
  .menu-list button { text-align: left; }

  /* ---- Recipe editor form ---- */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-grid label { font-size: .78rem; font-weight: 700; color: var(--ink-soft); display: block; margin-bottom: 3px; }
  .form-grid input, .form-grid select, .form-grid textarea { width: 100%; }
  .form-grid textarea { resize: vertical; min-height: 64px; }
  .tag-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag-toggle {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink-soft);
    border-radius: 99px; padding: 6px 12px; font: inherit; font-size: .8rem; font-weight: 600; cursor: pointer;
  }
  .tag-toggle.on { background: var(--green-soft); border-color: var(--green); color: var(--green-deep); }
  .ing-editor { display: grid; gap: 6px; }
  .ing-row { display: grid; grid-template-columns: 1fr 64px 84px 110px 32px; gap: 6px; align-items: center; }
  .ing-row .del { border: none; background: none; color: var(--coral); font-size: 1.05rem; cursor: pointer; }
  .nutrition-fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .nutrition-fields label { font-size: .72rem; font-weight: 700; color: var(--ink-soft); display: block; margin-bottom: 3px; }
  .nutrition-fields input { width: 100%; }
  .form-error { color: var(--coral); font-size: .85rem; margin-top: 10px; display: none; }

  footer {
    max-width: 980px; margin: 30px auto 10px; padding: 0 20px;
    display: flex; gap: 14px; align-items: center; justify-content: center;
    color: var(--ink-soft); font-size: .8rem; flex-wrap: wrap;
  }
  footer button { border: none; background: none; font: inherit; font-size: .8rem; color: var(--green); font-weight: 700; cursor: pointer; text-decoration: underline; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: var(--bg); padding: 11px 20px; border-radius: 99px;
    font-size: .88rem; font-weight: 600; z-index: 99; transition: transform .25s; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .ing-row { grid-template-columns: 1fr 52px 70px 90px 28px; }
  }
  @media print {
    header, .week-head, .shop-head, .tabs, footer, .extra-row, .item-del { display: none !important; }
    body { background: #fff; padding: 0; }
    .panel { display: none; }
    #panel-shop { display: block !important; }
    .shop-group { break-inside: avoid; }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="logo">🍽️ Meal<span>io</span></div>
    <div class="tagline">Easy family dinners for two grown-ups &amp; two small humans</div>
    <div class="family" id="familyChips" title="Tap a name to include/exclude them from portions"></div>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="week">📅 This Week</button>
    <button class="tab" data-tab="recipes">🍲 Recipes</button>
    <button class="tab" data-tab="shop">🛒 Shopping List</button>
  </nav>
</header>

<main>
  <!-- WEEK -->
  <section class="panel active" id="panel-week">
    <div class="week-head">
      <h2 id="weekLabel">Your week's box</h2>
      <div class="spacer"></div>
      <div class="box-size-ctrl" title="How many meals this week">
        <button class="icon-btn" id="boxMinusBtn" title="Fewer meals">−</button>
        <span id="boxSizeLabel">5 meals</span>
        <button class="icon-btn" id="boxPlusBtn" title="More meals">+</button>
      </div>
      <button class="btn ghost" id="clearWeekBtn">Clear</button>
      <button class="btn" id="planBtn">✨ Get my picks</button>
    </div>
    <div class="stats" id="weekStats"></div>
    <div class="box-grid" id="dayList"></div>
  </section>

  <!-- RECIPES -->
  <section class="panel" id="panel-recipes">
    <div class="filters">
      <input class="search" id="searchBox" type="search" placeholder="Search dinners…">
      <button class="filter-chip" data-filter="veggie">🥕 Veggie</button>
      <button class="filter-chip" data-filter="meat">🍗 Meat &amp; fish</button>
      <button class="filter-chip" data-filter="quick">⚡ 25 min or less</button>
      <button class="filter-chip" data-filter="kidfave">💚 Kid-approved</button>
      <button class="filter-chip" data-filter="batch">🍲 Batch &amp; freeze</button>
      <button class="filter-chip" data-filter="fun">🎉 Fun night</button>
      <button class="filter-chip" data-filter="mine">✏️ My recipes</button>
    </div>
    <div class="recipe-grid" id="recipeGrid"></div>
  </section>

  <!-- SHOPPING -->
  <section class="panel" id="panel-shop">
    <div class="shop-head">
      <h2>Shopping list</h2>
      <div class="spacer"></div>
      <button class="btn ghost" id="printBtn">🖨 Print</button>
      <button class="btn" id="copyBtn">📋 Copy list</button>
    </div>
    <p class="shop-note" id="shopNote"></p>
    <div id="shopGroups"></div>
  </section>
</main>

<footer>
  <span>Your plan, recipes &amp; ticks live in this browser.</span>
  <button id="exportBtn">💾 Export backup</button>
  <button id="importBtn">📥 Import backup</button>
  <input type="file" id="importFile" accept=".json,application/json" style="display:none">
</footer>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* =========================================================
   Recipe library — quantities are for 4 adult portions and
   get scaled to whoever's eating (see FAMILY below).
   kid: 1–3 = how reliably little ones eat it.
   diet: v = veggie, m = meat, f = fish.
   note: serving tips for a 4-year-old & a 2-year-old.
   ========================================================= */
const CATS = ["Fruit & Veg", "Meat & Fish", "Fridge", "Pantry", "Bakery", "Frozen", "Herbs & Spices", "Your extras"];
const R = (id, name, emoji, cuisine, mins, tags, kid, diet, note, ing, steps, nutrition) =>
  ({ id, name, emoji, cuisine, mins, tags, kid, diet, note, ing, steps, nutrition: nutrition || null });

const RECIPES = [
  /* ============ VEGGIE ============ */
  R("bolognese", "Hidden-Veg Lentil Bolognese", "🍝", "Italian", 30, ["quick","batch","freezer"], 3, "v",
    "Blitz the sauce smooth for the 2-year-old — carrots and lentils vanish completely. Serve the 4-year-old's pasta with sauce on the side if she's in a 'nothing touching' phase. Cut spaghetti short for little mouths.",
    [["spaghetti",350,"g","Pantry"],["red lentils (dried)",150,"g","Pantry"],["chopped tomatoes",2,"tins","Pantry"],["carrots",2,"","Fruit & Veg"],["onion",1,"","Fruit & Veg"],["celery sticks",2,"","Fruit & Veg"],["garlic cloves",2,"","Fruit & Veg"],["dried oregano",1,"tsp","Herbs & Spices"],["parmesan-style cheese",40,"g","Fridge"]],
    ["Finely chop (or grate) the onion, carrots and celery and soften in a little oil for 8 minutes.",
     "Add the garlic and oregano for 1 minute, then the lentils, tomatoes and 400ml water. Simmer 18–20 minutes until the lentils are soft, topping up water if it thickens too fast.",
     "Meanwhile cook the spaghetti following the pack.",
     "Blitz some sauce smooth for the little ones if needed, toss the rest with the pasta and serve with parmesan."],
    { kcal: 520, protein: 22, carbs: 78, fat: 12, fibre: 11, salt: 0.9 }),

  R("quesadillas", "Sweet Potato & Black Bean Quesadillas", "🌯", "Mexican", 20, ["quick","fun"], 3, "v",
    "Cut into small triangles — perfect toddler hand food. Skip any chilli in the kids' half. Cool the 2-year-old's pieces before serving; melted cheese stays hot inside.",
    [["flour tortillas",8,"","Bakery"],["sweet potatoes",2,"","Fruit & Veg"],["black beans",1,"tin","Pantry"],["grated cheddar",150,"g","Fridge"],["sweetcorn",1,"small tin","Pantry"],["avocado",1,"","Fruit & Veg"],["lime",1,"","Fruit & Veg"],["mild smoked paprika",1,"tsp","Herbs & Spices"]],
    ["Microwave or steam the diced sweet potato until soft (about 8 minutes), then mash with the drained beans, paprika and a squeeze of lime.",
     "Spread the mash over a tortilla, scatter with cheese and sweetcorn, and press a second tortilla on top.",
     "Toast in a dry frying pan for 2–3 minutes each side until golden and melted.",
     "Cut into triangles and serve with smashed avocado for dipping."],
    { kcal: 480, protein: 18, carbs: 58, fat: 19, fibre: 9, salt: 1.4 }),

  R("korma", "Creamy Coconut Chickpea Korma", "🍛", "Indian", 30, ["batch","freezer"], 3, "v",
    "Naturally mild and sweet — a great first curry. Lightly mash the chickpeas on the 2-year-old's plate (whole ones can be slippery). Naan strips are great for dipping practice.",
    [["chickpeas",2,"tins","Pantry"],["coconut milk",1,"tin","Pantry"],["korma paste (mild)",3,"tbsp","Pantry"],["basmati rice",300,"g","Pantry"],["onion",1,"","Fruit & Veg"],["spinach",100,"g","Fruit & Veg"],["naan breads",2,"","Bakery"],["ground almonds",2,"tbsp","Pantry"]],
    ["Soften the chopped onion in oil for 6–8 minutes, then stir in the korma paste for 1 minute.",
     "Add the drained chickpeas, coconut milk and ground almonds. Simmer gently for 15 minutes.",
     "Cook the rice following the pack and warm the naans.",
     "Stir the spinach through the curry until just wilted, then serve."],
    { kcal: 640, protein: 18, carbs: 85, fat: 24, fibre: 10, salt: 1.1 }),

  R("friedrice", "Rainbow Veggie Fried Rice", "🍚", "Chinese", 20, ["quick"], 3, "v",

/* Non-cooking nights */
/* ============ Family & portions ============ */
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const DEFAULT_FAMILY = [
  { key: "dad",      name: "Dad",          emoji: "🧔", factor: 1.0, on: true },
  { key: "mum",      name: "Mum",          emoji: "👩", factor: 1.0, on: true },
  { key: "daughter", name: "Daughter · 4", emoji: "👧", factor: 0.5, on: true },
  { key: "son",      name: "Son · 2",      emoji: "👦", factor: 0.3, on: true },
];

/* ============ The weekly box ============ */
const DEFAULT_BOX_SIZE = 5;
const MIN_BOX_SIZE = 3;
const MAX_BOX_SIZE = 8;
function emptySlot(day) { return { id: null, day: day === undefined ? null : day, locked: false }; }

/* ============ State ============ */
const STORE_KEY = "mealio";
const LEGACY_STORE_KEY = "herbi2"; // migrate anyone's data from the old Herbi branding
let state = load();
function normalize(raw) {
  if (!raw || typeof raw !== "object") return null;
  if (!Array.isArray(raw.box) && !Array.isArray(raw.week)) return null;
  if (!Array.isArray(raw.box)) {
    // migrate from the old 7-day week grid (pre-box versions of Mealio)
    const legacyWeek = Array.isArray(raw.week) ? raw.week : [];
    const legacyLocked = Array.isArray(raw.locked) ? raw.locked : [];
    raw.box = legacyWeek
      .map((id, i) => (id && id !== "_leftovers" && id !== "_out") ? { id, day: i, locked: !!legacyLocked[i] } : null)
      .filter(Boolean);
  }
  raw.box = raw.box
    .filter(s => s && typeof s === "object" && (s.id === null || s.id === undefined || typeof s.id === "string"))
    .map(s => ({
      id: s.id || null,
      day: Number.isInteger(s.day) && s.day >= 0 && s.day <= 6 ? s.day : null,
      locked: !!s.locked,
    }));
  while (raw.box.length < DEFAULT_BOX_SIZE) raw.box.push(emptySlot());
  delete raw.week; delete raw.locked;
  raw.family = (Array.isArray(raw.family) && raw.family.length === 4) ? raw.family : DEFAULT_FAMILY.map(m => ({...m}));
  raw.checked = raw.checked || {};
  raw.approvals = raw.approvals || {};
  raw.favorites = raw.favorites || [];
  raw.history = raw.history || [];
  raw.custom = (raw.custom || []).filter(r => r && r.id && r.name).map(r => ({
    ...r,
    tags: r.tags || [],
    ing: r.ing || [],
    steps: r.steps || [],
    diet: r.diet || "v",
    nutrition: (r.nutrition && typeof r.nutrition === "object") ? r.nutrition : null,
  }));
  raw.extras = raw.extras || [];
  return raw;
}
function freshState() {
  return {
    box: Array.from({ length: DEFAULT_BOX_SIZE }, () => emptySlot()), // this week's meal picks
    favorites: [],                    // recipe ids
    approvals: {},                    // id -> {daughter:bool, son:bool}
    checked: {},                      // shopping item key -> bool
    history: [],                      // last box's ids (variety between weeks)
    custom: [],                       // user-added recipes
    extras: [],                       // user-added shopping items [{n, q}]
    family: DEFAULT_FAMILY.map(m => ({...m})),
  };
}
function load() {
  try {
    const raw = normalize(JSON.parse(localStorage.getItem(STORE_KEY)));
    if (raw) return raw;
  } catch (e) { /* corrupted storage — start fresh */ }
  try {
    const legacy = normalize(JSON.parse(localStorage.getItem(LEGACY_STORE_KEY)));
    if (legacy) { localStorage.setItem(STORE_KEY, JSON.stringify(legacy)); return legacy; }
  } catch (e) { /* no legacy data either */ }
  return freshState();
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

const BUILTIN_BYID = Object.fromEntries(RECIPES.map(r => [r.id, r]));
function allRecipes() { return RECIPES.concat(state.custom); }
function getR(id) { return id ? (BUILTIN_BYID[id] || state.custom.find(r => r.id === id) || null) : null; }
const familyFactor = () => state.family.reduce((s, m) => s + (m.on ? m.factor : 0), 0);
const DIET_CHIP = { m: "🍗 meat", f: "🐟 fish" };

/* ============ Nutrition ============ */
const NUT_FIELDS = [
  { key: "kcal",    label: "kcal",    fmt: v => String(Math.round(v)) },
  { key: "protein", label: "protein", fmt: v => Math.round(v) + "g" },
  { key: "carbs",   label: "carbs",   fmt: v => Math.round(v) + "g" },
  { key: "fat",     label: "fat",     fmt: v => Math.round(v) + "g" },
  { key: "fibre",   label: "fibre",   fmt: v => Math.round(v) + "g" },
  { key: "salt",    label: "salt",    fmt: v => (Math.round(v * 10) / 10) + "g" },
];
function presentNutrition(nutrition) {
  if (!nutrition) return [];
  return NUT_FIELDS.filter(f => typeof nutrition[f.key] === "number" && !Number.isNaN(nutrition[f.key]));
}
function kcalChip(nutrition) {
  const n = nutrition && typeof nutrition.kcal === "number" ? Math.round(nutrition.kcal) : null;
  return n ? `<span class="chip">🔥 ${n} kcal</span>` : "";
}
function nutritionSection(nutrition) {
  const present = presentNutrition(nutrition);
  if (!present.length) return "";
  return `
    <div class="section-label">🥗 Nutrition · per adult portion (estimated)</div>
    <div class="nutrition-grid">
      ${present.map(f => `<div class="stat"><b>${esc(f.fmt(nutrition[f.key]))}</b>${f.label}</div>`).join("")}
    </div>
    <p class="nutrition-note">Estimated from the ingredients, not a lab analysis — a child's smaller portion will have less.</p>`;
}

/* ============ Picking the box ============ */
function candidates(usedIds, prevCuisine) {
  return allRecipes().filter(r => !usedIds.has(r.id) && (!prevCuisine || r.cuisine !== prevCuisine));
}
function scoreRecipe(r) {
  let s = Math.random() * 2;
  if (state.favorites.includes(r.id)) s += 2;
  const ap = state.approvals[r.id] || {};
  s += (ap.daughter ? 1 : 0) + (ap.son ? 1 : 0);
  s += r.kid * 0.6;                                         // general bias toward kid-friendly meals
  if (r.mins <= 25) s += 0.5;                                // mild preference for quicker meals
  if (state.history.includes(r.id)) s -= 2.5;               // didn't we just have this?
  return s;
}
function refreshBox() {
  const used = new Set(state.box.filter(s => s.locked && s.id).map(s => s.id));
  const newBox = state.box.map(s => ({ ...s }));
  for (let i = 0; i < newBox.length; i++) {
    if (newBox[i].locked && newBox[i].id) continue;
    const prevId = i > 0 ? newBox[i-1].id : null;
    const prev = prevId && getR(prevId) ? getR(prevId).cuisine : null;
    let pool = candidates(used, prev);
    if (!pool.length) pool = allRecipes().filter(r => !used.has(r.id));
    pool.sort((a, b) => scoreRecipe(b) - scoreRecipe(a));
    newBox[i].id = pool[0].id;
    used.add(newBox[i].id);
  }
  state.history = state.box.filter(s => s.id).map(s => s.id);
  state.box = newBox;
  state.checked = {};
  save(); renderAll();
  toast("Fresh picks ready! 🌱");
}
function swapSlot(i) {
  const used = new Set(state.box.filter((s, j) => j !== i && s.id).map(s => s.id));
  const prevId = i > 0 ? state.box[i-1].id : null;
  const prev = prevId && getR(prevId) ? getR(prevId).cuisine : null;
  let pool = candidates(used, prev).filter(r => r.id !== state.box[i].id);
  if (!pool.length) pool = allRecipes().filter(r => !used.has(r.id) && r.id !== state.box[i].id);
  if (!pool.length) { toast("No other dinners left to swap in"); return; }
  pool.sort((a, b) => scoreRecipe(b) - scoreRecipe(a));
  state.box[i].id = pool[Math.floor(Math.random() * Math.min(4, pool.length))].id;
  state.checked = {};
  save(); renderAll();
}
function addSlot() {
  if (state.box.length >= MAX_BOX_SIZE) { toast(`Your box tops out at ${MAX_BOX_SIZE} meals`); return; }
  state.box.push(emptySlot());
  save(); renderAll();
}
function removeSlot() {
  if (state.box.length <= MIN_BOX_SIZE) { toast(`Keep at least ${MIN_BOX_SIZE} meals in your box`); return; }
  let idx = state.box.length - 1;
  for (let i = state.box.length - 1; i >= 0; i--) { if (!state.box[i].locked) { idx = i; break; } }
  state.box.splice(idx, 1);
  state.checked = {};
  save(); renderAll();
}

/* ============ Shopping list ============ */
function shoppingList() {
  const scale = familyFactor() / 4;
  const map = new Map();
  state.box.forEach(slot => {
    const r = slot.id ? getR(slot.id) : null;
    if (!r) return;
    r.ing.forEach(([item, qty, unit, cat]) => {
      const key = item + "|" + unit;
      const cur = map.get(key) || { item, unit, cat: CATS.includes(cat) ? cat : "Pantry", qty: 0 };
      cur.qty += qty * scale;
      map.set(key, cur);
    });
  });
  const groups = {};
  for (const e of map.values()) {
    e.display = niceQty(e.qty, e.unit);
    (groups[e.cat] = groups[e.cat] || []).push(e);
  }
  for (const c in groups) groups[c].sort((a, b) => a.item.localeCompare(b.item));
  return groups;
}
function niceQty(q, unit) {
  const u = (unit || "").toLowerCase();
  if (u.includes("tin") || u.includes("jar") || u.includes("block") || u.includes("ball") ||
      u.includes("loaf") || u.includes("cube") || u.includes("bunch") || u.includes("thumb") ||
      u.includes("head") || u.includes("pinch") || u.includes("sheet") || u === "") {
    const n = Math.max(1, Math.ceil(q - 0.05));
    return unit ? `${n} ${unit}${n > 1 && !unit.endsWith("s") && !u.includes("pinch") ? "s" : ""}` : `${n}`;
  }
  if (u === "g" || u === "ml") return `${Math.ceil(q / 25) * 25} ${unit}`;
  if (u === "kg") return `${Math.ceil(q * 4) / 4} kg`;
  if (u === "tbsp" || u === "tsp") return `${Math.max(0.5, Math.round(q * 2) / 2)} ${unit}`;
  return `${Math.round(q * 2) / 2} ${unit}`;
}
function listAsText() {
  const groups = shoppingList();
  let out = "🍽️ Mealio shopping list\n";
  CATS.forEach(cat => {
    if (cat === "Your extras" || !groups[cat]) return;
    out += `\n${cat.toUpperCase()}\n`;
    groups[cat].forEach(e => { out += `  □ ${e.item} — ${e.display}\n`; });
  });
  if (state.extras.length) {
    out += `\nYOUR EXTRAS\n`;
    state.extras.forEach(e => { out += `  □ ${e.n}${e.q ? " — " + e.q : ""}\n`; });
  }
  return out;
}

function removeFromBox(i) {

let activeFilters = new Set();
function renderRecipes() {
  const q = $("#searchBox").value.trim().toLowerCase();
  const list = allRecipes().filter(r => {
    if (q && !(r.name + " " + r.cuisine).toLowerCase().includes(q)) return false;
    if (activeFilters.has("veggie") && r.diet !== "v") return false;
    if (activeFilters.has("meat") && r.diet === "v") return false;
    if (activeFilters.has("quick") && r.mins > 25) return false;
    if (activeFilters.has("fun") && !r.tags.includes("fun")) return false;
    if (activeFilters.has("batch") && !(r.tags.includes("batch") || r.tags.includes("freezer"))) return false;
    if (activeFilters.has("mine") && !r.id.startsWith("c_")) return false;
    if (activeFilters.has("kidfave")) {
      const a = state.approvals[r.id] || {};
      if (!a.daughter && !a.son && r.kid < 3) return false;
    }
    return true;
  });
  $("#recipeGrid").innerHTML =
    `<div class="recipe-card add-card" onclick="openEditor(null)">
      <div style="font-size:1.8rem">➕</div>
      <div>Add your own recipe</div>
    </div>` +
    (list.map(r => `
    <div class="recipe-card" onclick="openRecipe('${r.id}')">
      ${state.favorites.includes(r.id) ? `<div class="fav-mark">❤️</div>` : ""}
      <div class="emoji">${r.emoji}</div>
      <h3>${esc(r.name)}</h3>
      <div class="meal-meta">
        <span class="chip time">⏱ ${r.mins}m</span>
        ${r.cuisine ? `<span class="chip">${esc(r.cuisine)}</span>` : ""}
        ${DIET_CHIP[r.diet] ? `<span class="chip">${DIET_CHIP[r.diet]}</span>` : ""}
        ${kcalChip(r.nutrition)}
        <span class="chip kids">${"💚".repeat(r.kid)}</span>
        ${r.id.startsWith("c_") ? `<span class="chip mine">✏️ yours</span>` : ""}
        ${kidBadges(r.id)}
      </div>
    </div>`).join("") || `<p style="color:var(--ink-soft);align-self:center">No dinners match — try clearing a filter.</p>`);
}

function toggleCheck(key) { state.checked[key] = !state.checked[key]; save(); renderShop(); }
function addExtra() {

    <ul class="ing-list">

    </ul>` : ""}

    ${r.steps && r.steps.length ? `<div class="section-label">👨‍🍳 Method</div>
    <ol class="steps-list">

      <button class="approve-btn ${a.son ? "yes" : ""}" onclick="toggleApproval('${id}','son')">👦 Son ${a.son ? "✓ loved it" : "— tap if he ate it"}</button>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="toggleFav('${id}')">${fav ? "❤️ Favourited" : "🤍 Favourite"}</button>
      ${mine ? `<button class="btn ghost" onclick="openEditor('${id}')">✏️ Edit</button>
      <button class="btn danger" onclick="deleteCustom('${id}')">🗑 Delete</button>` : ""}
      <button class="btn" onclick="addToBox('${id}')">➕ Add to this week's box</button>
    </div>`;
  $("#overlay").classList.add("open");
}
function closeModal() { $("#overlay").classList.remove("open"); }
function toggleApproval(id, kid) {
  const a = state.approvals[id] = state.approvals[id] || {};
  a[kid] = !a[kid];
  save(); openRecipe(id); renderWeek(); renderRecipes();
}
function toggleFav(id) {
  const i = state.favorites.indexOf(id);
  if (i >= 0) state.favorites.splice(i, 1); else state.favorites.push(id);
  save(); openRecipe(id); renderRecipes();
}
function addToBox(id) {
  const already = state.box.some(s => s.id === id);
  if (already) { toast(`${getR(id).emoji} Already in this week's box`); closeModal(); switchTab("week"); return; }
  let idx = state.box.findIndex(s => !s.id);
  if (idx === -1) {
    if (state.box.length >= MAX_BOX_SIZE) { toast(`Your box is full (max ${MAX_BOX_SIZE}) — remove a meal first`); return; }
    state.box.push(emptySlot());
    idx = state.box.length - 1;
  }
  state.box[idx].id = id;
  state.checked = {};
  save(); renderAll(); closeModal();
  toast(`${getR(id).emoji} Added to this week's box`);
  switchTab("week");
}

function saveEditor(id) {

  const err = $("#f_error");
  if (!name) { err.textContent = "Give your recipe a name."; err.style.display = "block"; return; }
  const mins = Math.min(240, Math.max(5, parseInt($("#f_mins").value, 10) || 30));
  const ing = [...document.querySelectorAll("[data-ing]")].map(row => {
    const item = row.querySelector(".i-item").value.trim();
    if (!item) return null;
    const qty = parseFloat(row.querySelector(".i-qty").value) || 1;
    const unit = row.querySelector(".i-unit").value.trim();
    const cat = row.querySelector(".i-cat").value;
    return [item, qty, unit, cat];
  }).filter(Boolean);
  const nutrition = {};
  NUT_FIELDS.forEach(f => {
    const raw = $("#f_nut_" + f.key).value;
    if (raw !== "") { const v = parseFloat(raw); if (!Number.isNaN(v)) nutrition[f.key] = v; }
  });
  const recipe = {
    id: id || ("c_" + Date.now().toString(36)),
    name,
    emoji: $("#f_emoji").value.trim() || "🍽️",
    cuisine: $("#f_cuisine").value.trim(),
    mins,
    kid: parseInt($("#f_kid").value, 10),
    diet: $("#f_diet").value,
    tags: [...document.querySelectorAll("#f_tags .tag-toggle.on")].map(b => b.dataset.tag),
    note: $("#f_note").value.trim(),
    steps: $("#f_steps").value.split("\n").map(s => s.trim()).filter(Boolean),
    ing,
    nutrition: Object.keys(nutrition).length ? nutrition : null,
  };
  if (id) {
    const idx = state.custom.findIndex(r => r.id === id);
    if (idx >= 0) state.custom[idx] = recipe; else state.custom.push(recipe);
  } else {
    state.custom.push(recipe);
  }
  save(); renderAll(); closeModal();
  toast(id ? "Recipe updated ✏️" : `${recipe.emoji} ${recipe.name} added to your library!`);
  if (!id) { activeFilters.clear(); document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active")); switchTab("recipes"); renderRecipes(); }
}
function deleteCustom(id) {
  const r = getR(id);
  if (!r || !confirm(`Delete "${r.name}"? This can't be undone.`)) return;
  state.custom = state.custom.filter(x => x.id !== id);
  state.box = state.box.map(s => s.id === id ? emptySlot(s.day) : s);
  state.favorites = state.favorites.filter(x => x !== id);
  delete state.approvals[id];
  save(); renderAll(); closeModal();
  toast("Recipe deleted");
}

/* ============ Backup ============ */
function exportBackup() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `mealio-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Backup downloaded 💾");
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const raw = normalize(JSON.parse(reader.result));
      if (!raw) throw new Error("bad shape");
      state = raw;
      save(); renderAll();
      toast("Backup restored 📥");
    } catch (e) {
      toast("That file doesn't look like a Mealio backup");
    }
  };
  reader.readAsText(file);
}

/* ============ Chrome ============ */
function switchTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
}
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
function renderAll() { renderFamily(); renderWeek(); renderRecipes(); renderShop(); }

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));
document.querySelectorAll(".filter-chip").forEach(c => c.addEventListener("click", () => {
  const f = c.dataset.filter;
  if (activeFilters.has(f)) activeFilters.delete(f); else activeFilters.add(f);
  c.classList.toggle("active");
  renderRecipes();
}));
$("#searchBox").addEventListener("input", renderRecipes);
$("#planBtn").addEventListener("click", refreshBox);
$("#boxPlusBtn").addEventListener("click", addSlot);
$("#boxMinusBtn").addEventListener("click", removeSlot);
$("#clearWeekBtn").addEventListener("click", () => {
  state.box = state.box.map(s => emptySlot(s.day));
  state.checked = {};
  save(); renderAll();
});
$("#copyBtn").addEventListener("click", () => {
  navigator.clipboard.writeText(listAsText())
    .then(() => toast("List copied — paste it anywhere 📋"))
    .catch(() => toast("Couldn't copy — try the print button"));
});
$("#printBtn").addEventListener("click", () => window.print());
$("#exportBtn").addEventListener("click", exportBackup);
$("#importBtn").addEventListener("click", () => $("#importFile").click());
$("#importFile").addEventListener("change", e => {
  if (e.target.files[0]) importBackup(e.target.files[0]);
  e.target.value = "";
});
$("#familyChips").addEventListener("click", e => {
  const btn = e.target.closest("[data-member]");
  if (!btn) return;
  const m = state.family[+btn.dataset.member];
  m.on = !m.on;
  save(); renderAll();
  toast(m.on ? `${m.name} is back at the table` : `${m.name} skipped — portions adjusted`);
});
$("#overlay").addEventListener("click", e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

renderAll();

// Register the service worker so Mealio can be installed and used offline.
// Skipped on file:// (opened locally) since service workers need http(s).
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* offline support is a bonus, not required */ });
  });
}
</script>
</body>
</html>
